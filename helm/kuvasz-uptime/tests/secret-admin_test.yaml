suite: admin secret
templates:
  - secret-admin.yaml
  - deployment.yaml
  - configmap.yaml
release:
  name: t
  namespace: kuvasz
chart:
  version: 1.0.0
  appVersion: 1.0.0
tests:
  - it: should generate the credentials when there is no deployed secret
    template: secret-admin.yaml
    asserts:
      - matchRegex:
          path: data.admin-user
          pattern: ^[A-Za-z0-9+/]+=*$
      - matchRegex:
          path: data.admin-password
          pattern: ^[A-Za-z0-9+/]+=*$

  - it: should reuse the credentials of the deployed secret
    template: secret-admin.yaml
    kubernetesProvider: &deployedSecret
      scheme: &secretScheme
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: t-kuvasz-uptime-admin
            namespace: kuvasz
          data:
            admin-user: ZGVwbG95ZWQtdXNlcg==
            admin-password: ZGVwbG95ZWQtcGFzc3dvcmQ=
    asserts:
      - equal:
          path: data.admin-user
          value: ZGVwbG95ZWQtdXNlcg==
      - equal:
          path: data.admin-password
          value: ZGVwbG95ZWQtcGFzc3dvcmQ=

  - it: should prefer the explicit credentials over the deployed ones
    template: secret-admin.yaml
    kubernetesProvider: *deployedSecret
    set:
      auth.adminUser: explicit-user
      auth.adminPassword: explicit-password
    asserts:
      - equal:
          path: data.admin-user
          value: ZXhwbGljaXQtdXNlcg==
      - equal:
          path: data.admin-password
          value: ZXhwbGljaXQtcGFzc3dvcmQ=

  - it: should combine an explicit user with the deployed password
    template: secret-admin.yaml
    kubernetesProvider: *deployedSecret
    set:
      auth.adminUser: explicit-user
    asserts:
      - equal:
          path: data.admin-user
          value: ZXhwbGljaXQtdXNlcg==
      - equal:
          path: data.admin-password
          value: ZGVwbG95ZWQtcGFzc3dvcmQ=

  - it: should combine the deployed user with an explicit password
    template: secret-admin.yaml
    kubernetesProvider: *deployedSecret
    set:
      auth.adminPassword: explicit-password
    asserts:
      - equal:
          path: data.admin-user
          value: ZGVwbG95ZWQtdXNlcg==
      - equal:
          path: data.admin-password
          value: ZXhwbGljaXQtcGFzc3dvcmQ=

  - it: should generate only the credential that is missing from the deployed secret
    template: secret-admin.yaml
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: t-kuvasz-uptime-admin
            namespace: kuvasz
          data:
            admin-user: ZGVwbG95ZWQtdXNlcg==
    asserts:
      - equal:
          path: data.admin-user
          value: ZGVwbG95ZWQtdXNlcg==
      - matchRegex:
          path: data.admin-password
          pattern: ^[A-Za-z0-9+/]+=*$

  - it: should not reuse a secret from another namespace
    template: secret-admin.yaml
    kubernetesProvider:
      scheme: *secretScheme
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: t-kuvasz-uptime-admin
            namespace: other
          data:
            admin-user: ZGVwbG95ZWQtdXNlcg==
            admin-password: ZGVwbG95ZWQtcGFzc3dvcmQ=
    asserts:
      - notEqual:
          path: data.admin-user
          value: ZGVwbG95ZWQtdXNlcg==
      - notEqual:
          path: data.admin-password
          value: ZGVwbG95ZWQtcGFzc3dvcmQ=

  - it: should not render the secret when it is managed externally
    template: secret-admin.yaml
    kubernetesProvider: *deployedSecret
    set:
      externalAdminSecret: true
    asserts:
      - hasDocuments:
          count: 0

  # The expected value is the sha256 of the rendered Secret, so it has to be updated when the
  # Secret template or the common labels change. It must stay the same between test runs.
  - it: should keep the checksum of the admin secret when the deployed credentials are reused
    template: deployment.yaml
    kubernetesProvider: *deployedSecret
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret-admin"]
          value: 3cb99ca74a8dbd3ea0cf3660bc8987a7de618dcaaa2262545e313ed7d3ea9960
