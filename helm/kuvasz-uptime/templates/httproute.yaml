{{- include "kuvasz.validateExtraHttpRoutes" . }}
{{- if .Values.httpRoute.enabled }}
{{ include "kuvasz.httpRoute" (dict "root" . "name" (include "kuvasz.fullname" .) "route" .Values.httpRoute) }}
{{- end }}
{{- range .Values.extraHttpRoutes }}
---
{{ include "kuvasz.httpRoute" (dict "root" $ "name" (include "kuvasz.extraHttpRouteName" (dict "root" $ "route" .)) "route" .) }}
{{- end }}
