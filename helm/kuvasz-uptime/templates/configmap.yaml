apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuvasz.fullname" . }}-config
  labels:
    {{- include "kuvasz.labels" . | nindent 4 }}
data:
  kuvasz.yml: |
{{- if .Values.config.raw }}
{{ .Values.config.raw | indent 4 }}
{{- else }}
# Kuvasz configuration file
# Add your integrations, monitors, and other settings here
# See https://kuvasz-uptime.dev for more information
{{- end }}

