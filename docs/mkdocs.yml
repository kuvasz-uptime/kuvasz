site_name: Kuvasz Uptime
site_url: https://kuvasz-uptime.dev
site_description: Kuvasz is an open-source, self-hosted uptime monitoring solution that provides comprehensive monitoring capabilities for websites and services.
repo_url: https://github.com/kuvasz-uptime/kuvasz
theme:
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  name: material
  logo: images/kuvasz-logo.webp
  favicon: images/favicon.png
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
plugins:
  - search
  - social
  - glightbox:
      skip_classes:
        - skip-lb
extra:
  annotate:
    json: [ .s2 ]
  consent:
    title: Cookie consent
    actions:
      - accept
      - reject
      - manage
    description: >-
      We use cookies to render the GitHub widget in the header of this documentation. 
      With your consent, you're helping us to make our documentation better.
hooks:
  - overrides/hooks/shortcodes.py
extra_css:
  - stylesheets/custom.css
nav:
  - Introduction: index.md
  - Live demo: demo.md
  - Features:
      - HTTP monitoring: features/http-monitoring.md
      - SSL monitoring: features/ssl-monitoring.md
      - Push monitoring: features/push-monitoring.md
      - Status pages: features/status-pages.md
      - Notifications: features/notifications.md
      - Web UI: features/ui.md
      - Flexibility: features/flexibility.md
      - API: features/api.md
  - Getting started:
      - Deployment: setup/installation.md
      - Configuration reference: setup/configuration.md
      - Official Helm chart: setup/helm-deployment.md
  - Management:
      - Integrations setup: management/integrations.md
      - Managing monitors:
          - management/managing-monitors/index.md
          - HTTP & SSL monitors: management/http-monitors.md
          - Push monitors: management/push-monitors.md
      - Status pages: management/status-pages.md
      - Metrics exporters: management/metrics-exporters.md
      - Recipes & examples: management/examples.md
  - API docs ⏏: https://api-docs.kuvasz-uptime.dev
  - Changelog: changelog.md
  - Upgrade notes: upgrade-notes.md
  - Roadmap ⏏: https://github.com/orgs/kuvasz-uptime/projects/2/views/1
  - Conventions: conventions.md
  - Localization: localization.md
  - Contributing ⏏: https://github.com/kuvasz-uptime/kuvasz/blob/main/CONTRIBUTING.md
  - License ⏏: https://github.com/kuvasz-uptime/kuvasz/blob/main/LICENSE
  - Sponsoring ♥: sponsoring.md
copyright: >
  Copyright &copy; 2020 - 2025 Kuvasz Uptime - 
  <a href="#__consent">Change cookie settings</a>
