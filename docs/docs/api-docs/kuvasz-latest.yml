components:
  schemas:
    ApiErrorCode:
      type: string
      enum:
      - MONITOR_NAME_CANNOT_BE_CHANGED
      - MONITOR_CANNOT_BE_DELETED
    DiscordNotificationConfigDto:
      required:
      - enabled
      - excludedEvents
      - global
      - id
      - name
      - type
      type: object
      properties:
        id:
          type: string
          description: "A unique identifier for an integration, formatted as 'type:name'."
          example: email:my-email-integration
        type:
          description: Type of the integration
          allOf:
          - $ref: "#/components/schemas/IntegrationType"
        name:
          type: string
          description: Name of the integration. Must be unique in the context of type.
        enabled:
          type: boolean
          description: Whether the integration is enabled
        global:
          type: boolean
          description: Whether the integration is global (applies to all monitors
            by default)
        excludedEvents:
          type: array
          description: "The list of the events that should be excluded from notifications\
            \ for this integration. If empty or null, no event types are excluded."
          items:
            $ref: "#/components/schemas/IntegrationEventType"
    EmailNotificationConfigDto:
      required:
      - enabled
      - excludedEvents
      - fromAddress
      - global
      - id
      - name
      - toAddress
      - type
      type: object
      properties:
        id:
          type: string
          description: "A unique identifier for an integration, formatted as 'type:name'."
          example: email:my-email-integration
        type:
          description: Type of the integration
          allOf:
          - $ref: "#/components/schemas/IntegrationType"
        name:
          type: string
          description: Name of the integration. Must be unique in the context of type.
        enabled:
          type: boolean
          description: Whether the integration is enabled
        global:
          type: boolean
          description: Whether the integration is global (applies to all monitors
            by default)
        excludedEvents:
          type: array
          description: "The list of the events that should be excluded from notifications\
            \ for this integration. If empty or null, no event types are excluded."
          items:
            $ref: "#/components/schemas/IntegrationEventType"
        fromAddress:
          type: string
          description: The email address from which notifications are sent
        toAddress:
          type: string
          description: The email address to which notifications are sent
    GenericWebhookMessage:
      required:
      - eventDetails
      - monitorDetailsUrl
      - monitorId
      - monitorName
      - monitorUrn
      - timestamp
      - type
      type: object
      properties:
        monitorId:
          type: integer
          format: int64
        monitorUrn:
          type: string
        monitorName:
          type: string
        monitorDetailsUrl:
          type: string
        timestamp:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/IntegrationEventType"
        eventDetails:
          type: string
    HealthResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          - UNKNOWN
    HistoricalUptimeStatsDto:
      required:
      - affectedMonitors
      - incidents
      - period
      - totalDowntimeSeconds
      - uptimeRatio
      type: object
      properties:
        period:
          type: string
          description: The period that was used for the calculation. An ISO-8601 Duration
            string.
        incidents:
          type: integer
          description: Total number of incidents recorded across all monitors.
          format: int32
        affectedMonitors:
          type: integer
          description: Total number of monitors that have been affected by incidents.
          format: int32
        uptimeRatio:
          type: number
          description: The percentage of uptime across all monitors.
          format: double
          nullable: true
        totalDowntimeSeconds:
          type: integer
          description: Total downtime in seconds across all monitors.
          format: int64
    HttpMethod:
      type: string
      enum:
      - GET
      - HEAD
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    HttpMonitorCreateDto:
      required:
      - name
      - uptimeCheckInterval
      - url
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: "Unique name for the monitor, e.g., 'My Server Monitor'"
          x-size-message: Monitor name must not be blank
        url:
          pattern: "^(https?)://[-a-zA-Z0-9+&@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&@#/%=~_|]"
          type: string
          description: "The URL that is monitored, must include the protocol (http(s)://)\
            \ as well."
          x-pattern-message: URL must be a valid HTTP(S) URI
          x-not-null-message: URL must not be null
        sensitiveUrl:
          type: boolean
          description: "Whether the URL is sensitive (e.g. contains a secret token).\
            \ If true, the URL will be masked in integrations, logs and metrics to\
            \ protect sensitive information."
          default: false
        uptimeCheckInterval:
          minimum: 5
          type: integer
          description: The interval in seconds at which the monitor will be checked
          format: int32
          x-minimum-message: "Uptime check interval must be at least {value} seconds"
          x-not-null-message: Uptime check interval must not be null
        enabled:
          type: boolean
          description: "Whether the monitor is enabled. If false, the monitor will\
            \ not perform checks."
          default: true
        sslCheckEnabled:
          type: boolean
          description: Whether the monitor checks the SSL certificate for expiry and
            validity.
          default: false
        requestMethod:
          description: The HTTP method used for the uptime check
          allOf:
          - $ref: "#/components/schemas/HttpMethod"
          default: GET
        latencyHistoryEnabled:
          type: boolean
          description: Whether latency history is enabled for the monitor
          default: true
        forceNoCache:
          type: boolean
          description: Whether to send a force no-cache headers in the request
          default: true
        followRedirects:
          type: boolean
          description: Whether to follow redirects during the uptime check
          default: true
        sslExpiryThreshold:
          minimum: 0
          type: integer
          description: The threshold in days for SSL certificate expiry checks
          format: int32
          default: 30
          x-minimum-message: SSL expiry threshold must be greater than or equal to
            0 days
          x-not-null-message: SSL expiry threshold must not be null
        integrations:
          type: array
          description: "List of integrations explicitly assigned to the monitor, e.g.\
            \ \"email:my-email-notification\""
          nullable: true
          items:
            type: string
        expectedStatusCodes:
          type: array
          description: "List of expected HTTP status codes for the monitor. If the\
            \ response code is not in this list, the monitor will be marked as DOWN.\
            \ By default, every 2xx status will be considered as UP. 1xx, 2xx, 3xx\
            \ and 4xx codes are supported."
          nullable: true
          items:
            type: integer
            format: int32
        responseTimeThresholdMillis:
          maximum: 30000
          minimum: 0
          exclusiveMinimum: true
          type: integer
          description: "The threshold in milliseconds for the response time. If the\
            \ response time exceeds this value, the monitor will be marked as DOWN."
          format: int32
          nullable: true
          x-maximum-message: "Response time threshold must be less than or equal to\
            \ {value} milliseconds"
          x-minimum-message: Response time threshold must be greater than 0 milliseconds
        expectedKeyword:
          type: string
          description: "A keyword that is expected to be present in the response body.\
            \ If the keyword is not found, the monitor will be marked as DOWN."
          nullable: true
        expectedKeywordCaseSensitive:
          type: boolean
          description: "Whether the expected keyword check is case-sensitive. If false,\
            \ the check will be case-insensitive."
          default: false
        expectedKeywordNegated:
          type: boolean
          description: "Whether the expected keyword check is negated. If true, the\
            \ monitor will be marked as DOWN if the keyword is found in the response\
            \ body."
          default: false
        requestHeaders:
          type: object
          additionalProperties:
            type: string
          description: "Custom HTTP headers to be sent with the request. It is a map\
            \ of header names to values, null values are not allowed."
        expectedHeaders:
          type: object
          additionalProperties:
            type: string
          description: "Expected HTTP headers in the response. If any of these headers\
            \ are missing, the monitor will be marked as DOWN. It is a map of header\
            \ names to values, null values are not allowed. The check will be case-insensitive\
            \ for the header names, but the values must match exactly"
        requestBody:
          type: string
          description: "The body of the request to be sent, which is used for POST,\
            \ PATCH and PUT requests. Currently only valid JSON bodies are supported."
          nullable: true
        failureCountThreshold:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          description: The threshold for consecutive failures before the monitor is
            marked as DOWN
          format: int64
          default: 1
          x-minimum-message: Failure count threshold must be greater than 0
          x-not-null-message: Failure count threshold must not be null
    HttpMonitorDetailsDto:
