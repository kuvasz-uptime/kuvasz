            application/json:
              schema:
                $ref: "#/components/schemas/HttpMonitorDetailsDto"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
      security:
      - apiKey: []
      - bearerAuth: []
    delete:
      tags:
      - HTTP monitors
      summary: Delete a monitor by ID
      operationId: deleteMonitor
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Successful deletion
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
        "404":
