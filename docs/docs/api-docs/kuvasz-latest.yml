          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
        "405":
          description: "HTTP monitors are in read-only mode, because they are loaded\
            \ from a YAML config file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
      security:
      - apiKey: []
      - bearerAuth: []
    patch:
      tags:
      - HTTP monitors
      summary: Update a monitor by ID
      description: Updates the monitor with the given ID. Only fields that are present
        in the request body will be updated. Fields not present in the request body
        will remain unchanged.
      operationId: updateMonitor
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HttpMonitorUpdateDto"
        required: true
      responses:
        "200":
          description: Successful update
