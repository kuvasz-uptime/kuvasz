openapi: 3.0.1
info:
  title: Kuvasz Uptime
  description: "Kuvasz Uptime is an open-source, self-hostable uptime monitoring and\
    \ status page service."
  contact:
    name: Official Documentation
    url: https://kuvasz-uptime.dev
  version: latest
  x-logo:
    url: https://github.com/kuvasz-uptime/kuvasz/raw/main/docs/docs/images/kuvasz-banner-light.webp
tags:
- name: HTTP monitors
- name: Incidents
- name: Integrations
- name: Maintenance windows
- name: Management
- name: Monitors
- name: Push monitors
- name: Settings
- name: Status pages
paths:
  /api/v2/http-monitors:
    get:
      tags:
      - HTTP monitors
      summary: Get all monitors with their details
      operationId: getMonitorsWithDetails
      parameters:
      - name: enabled
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      - name: uptimeStatus
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/UptimeStatus"
      - name: sslStatus
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SslStatus"
      - name: sslCheckEnabled
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HttpMonitorDetailsDto"
      security:
      - apiKey: []
      - bearerAuth: []
    post:
      tags:
      - HTTP monitors
      summary: Create a monitor
      operationId: createMonitor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HttpMonitorCreateDto"
        required: true
      responses:
        "201":
          description: Successful creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpMonitorDto"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
        "405":
          description: "HTTP monitors are in read-only mode, because they are loaded\
            \ from a YAML config file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceError"
      security:
      - apiKey: []
      - bearerAuth: []
  /api/v2/http-monitors/stats:
    get:
      tags:
      - HTTP monitors
      summary: "Get the overall, cumulative stats of all monitors"
      operationId: getMonitoringStats
      parameters:
      - name: period
        in: query
        explode: false
        schema:
          type: string
          description: "An ISO-8601 Duration string, default P7D"
          nullable: true
      responses:
        "200":
          description: Successful query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpMonitoringStatsDto"
      security:
      - apiKey: []
      - bearerAuth: []
  /api/v2/http-monitors/{monitorId}:
    get:
      tags:
      - HTTP monitors
      summary: Get a monitor's details
      operationId: getMonitorDetails
      parameters:
      - name: monitorId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
