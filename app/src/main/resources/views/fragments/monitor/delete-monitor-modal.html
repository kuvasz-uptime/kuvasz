{% macro deleteMonitorModal(id, name) %}
<!--BEGIN DELETE MODAL-->
<div class="modal modal-blur rounded bg-surface-backdrop"
     id="delete-monitor-modal-{{ id }}" tabindex="-1">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <button type="button" class="btn-close" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            <div class="modal-status bg-danger"></div>
            <div class="modal-body text-center py-4">
                <h3>Are you sure?</h3>
                <div class="text-secondary">
                    Do you really want to delete your monitor "{{ name }}"? <strong>All of your previously
                    recorded metrics will be lost!</strong>
                </div>
            </div>
            <div class="modal-footer">
                <div class="w-100">
                    <div class="row">
                        <div class="col">
                            <a href="#" class="btn w-100" data-bs-dismiss="modal"> Cancel </a>
                        </div>
                        <div class="col">
                            <button @click="deleteMonitor()" class="btn btn-danger w-100"
                                    data-bs-dismiss="modal">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--END DELETE MODAL-->
{% endmacro %}
