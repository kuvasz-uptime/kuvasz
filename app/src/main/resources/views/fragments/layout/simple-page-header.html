{% macro simplePageHeader(preTitle, title) %}
<div class="container-xl">
    <div class="row g-2 align-items-center">
        <div class="col">
            <div class="page-pretitle">{{ preTitle }}</div>
            <h2 class="page-title">{{ title }}</h2>
        </div>
    </div>
</div>
{% endmacro %}
