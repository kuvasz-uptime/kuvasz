---
micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${random.uuid2}
    enabled: false
  mcp:
    server:
      enabled: true
  # Allow oversized uploads so MonitorController's own 10 MB limit is the binding one in tests.
  # The framework defaults (10 MB request / 1 MB per file) would otherwise reject first.
  server:
    max-request-size: 20971520
    multipart:
      max-file-size: 20971520
---
datasources:
  default:
    initialPoolSize: 1
    maximumPoolSize: 2
    minimumIdle: 0
---
logger:
  levels:
#    org.jooq: DEBUG
---
# Disable the scheduled checks for updates in tests to avoid unnecessary noise and network calls during testing
app-config.check-updates: false
