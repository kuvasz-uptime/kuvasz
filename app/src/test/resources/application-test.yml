---
micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${random.uuid2}
    enabled: false
  mcp:
    server:
      enabled: true
---
datasources:
  default:
    initialPoolSize: 1
    maximumPoolSize: 2
    minimumIdle: 0
    maxLifetime: 30000
    idleTimeout: 10000
---
logger:
  levels:
#    org.jooq: DEBUG
---
# Disable the scheduled checks for updates in tests to avoid unnecessary noise and network calls during testing
app-config.check-updates: false
---
# The Slack Bot client retries with a long backoff, the tests don't need to wait for it
internal.slack-bot-retry-delay: 10ms
