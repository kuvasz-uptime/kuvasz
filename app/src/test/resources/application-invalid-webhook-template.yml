integrations:
  webhook:
    - name: test_implicitly_enabled
      url: https://custom-webhook.com/webhook
    - name: Global2_with_headers
      url: https://custom-global-webhook.com
      global: true
      payload-template: |
        {
          "monitorName": "{{ctx.monitorName}}",
          "type": "{%ctx.type}}"
        }
    - name: disabled
      url: https://disabled-webhook.com
      enabled: false
