---
micronaut:
  security:
    enabled: true
admin-auth:
  username: e2e-admin
  password: e2e-admin-password-123
datasources:
  default:
    initialPoolSize: 1
    maximumPoolSize: 3
    minimumIdle: 2
app-config:
  # No outbound update checks during the E2E run
  check-updates: false
docker-hosts:
  - name: local
    url: unix:///var/run/kuvasz-e2e-not-a-real-docker.sock
  - name: vps-1
    url: tcp://127.0.0.1:1
