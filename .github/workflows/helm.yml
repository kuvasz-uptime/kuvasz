name: Release Helm Chart

on:
  release:
    types: [published]

env:
  HELM_VERSION: v4.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"
      
      - name: Update Chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" helm/kuvasz-uptime/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" helm/kuvasz-uptime/Chart.yaml
      
      - name: Package Helm chart
        run: |
          helm package helm/kuvasz-uptime
      
      - name: Push Helm chart to OCI registry
        run: |
          CHART_PACKAGE=$(ls kuvasz-uptime-*.tgz)
          helm push $CHART_PACKAGE oci://ghcr.io/${{ github.repository_owner }}
      
      - name: Log out from registry
        if: always()
        run: |
          helm registry logout ghcr.io