name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'docker-examples/**'
      - 'localdev/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'docker-examples/**'
      - 'localdev/**'
jobs:
  validate-generated-sources:
    name: Validate generated sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate translations
        run: ./gradlew :shared:validateI18n
      - name: Validate that JSON schemas are self-contained
        run: ./gradlew :app:validateJsonSchemas
      - name: Generate OpenAPI spec
        run: ./gradlew :app:updateApiDoc
      - name: Validate that generated sources are committed
        run: git diff --quiet --exit-code HEAD --

  detekt:
    name: Run static analysis with Detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Run detekt
        run: ./gradlew detektAll

  check:
    name: Run tests and generate code coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Run check
        run: ./gradlew check -x detekt -x detektMain -x detektTest
      - name: Generate code coverage report for Codecov
        run: ./gradlew koverXmlReport
      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}
          files: ./build/reports/kover/report.xml
          fail_ci_if_error: false

  ui-tests:
    name: Run UI test suite (unit + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run JS unit tests
        run: ./gradlew :ui:jsTest
      - name: Install Playwright Chromium
        run: ./gradlew :app:installPlaywrightChromium
      - name: Run UI E2E suite
        run: ./gradlew :app:uiTest
      - name: Upload UI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: app/build/uiTest-artifacts/
          if-no-files-found: ignore
