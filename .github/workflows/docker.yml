name: Release Docker image

# Builds the image natively on each architecture, because the AOT cache is trained during the build (see
# app/docker/Dockerfile), which is slow and less effective under emulation. Then merges them into one multi-arch image.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      latest:
        description: 'Tag the image as latest too'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: kuvaszmonitoring/kuvasz

jobs:
  layers:
    name: Prepare the files of the image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the git tags
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare the files of the image
        run: ./gradlew :app:dockerLayers
      - name: Get the version
        id: version
        run: |
          echo "version=$(./gradlew -q :app:properties --property version | sed -n 's/^version: //p')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-layers
          path: app/build/docker/layers
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build the image (${{ matrix.arch }})
    needs: layers
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-layers
          path: app/build/docker/layers
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the image and train its AOT cache
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.layers.outputs.version }}
            REVISION=${{ github.sha }}
          load: true
          tags: kuvasz:candidate
      - name: Check the image
        run: app/docker/check-image.sh kuvasz:candidate
      # Comes from the build cache of the previous step, so it's only pushed, not built again
      - name: Push the image by its digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.layers.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch image
    needs: [layers, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.layers.outputs.version }}
          EVENT: ${{ github.event_name }}
          LATEST_INPUT: ${{ inputs.latest }}
        # Tag pushes of final releases (e.g. 4.6.0, not 4.6.0-rc) are the latest, manual runs only when asked
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if { [ "$EVENT" = "push" ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; } || [ "$LATEST_INPUT" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
