name: Deploy docs to GitHub Pages
on:
  push:
    tags:
      - '*'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      # The optimize plugin's cache is deliberately not cached: on a cache hit, its worker thread rewrites file.src_path
      # while the main thread is still calling files.remove(file) -> intermittent "not in collection" ValueError
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-v2-${{ env.cache_id }}
          path: |
            docs/.cache/plugin/social
            docs/.cache/plugin/privacy
          restore-keys: |
            mkdocs-material-v2-
      - run: sudo apt-get update && sudo apt-get install -y pngquant
      - run: pip install -r requirements.txt
        working-directory: docs
      - run: mkdocs gh-deploy --force
        working-directory: docs
