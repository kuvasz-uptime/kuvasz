services:
  # You can omit this service if you already have a PostgreSQL instance running somewhere,
  # but in this case make sure to adjust the connection details of the kuvasz service accordingly
  kuvasz-db:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuvasz
      POSTGRES_PASSWORD: YourSuperSecretDbPassword # change it!
      TZ: 'UTC' # optional, but recommended, use your own timezone
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "kuvasz" ]
      interval: 10s
      start_period: 30s
    volumes:
      - kuvasz-db-data:/var/lib/postgresql
  kuvasz:
    image: kuvaszmonitoring/kuvasz:latest
    restart: unless-stopped
    # If you plan to run Kuvasz on an ARM based system, you might need to uncomment this line, depending on your setup
    # platform: linux/arm64
    ports:
      # If the port 8080 is already in use on your host machine, change the left side of the mapping (e.g. "9090:8080")
      - "8080:8080"
    environment:
      TZ: 'UTC' # optional, but recommended, match it with the kuvasz-db service above
      DATABASE_HOST: kuvasz-db # the service name of the PostgreSQL service above
      DATABASE_USER: kuvasz # the same user as in the PostgreSQL service above
      DATABASE_PASSWORD: YourSuperSecretDbPassword # the same password as in the PostgreSQL service above
      ADMIN_USER: YourSuperSecretUsername # change it!
      ADMIN_PASSWORD: YourSuperSecretPassword # change it!
    volumes:
      # Make sure your config file is readable and the mount path is correct (/config/kuvasz.yml)
      - ./kuvasz.yml:/config/kuvasz.yml
      # Only needed to monitor the containers of this machine through a Docker host with a "unix:///var/run/docker.sock" URL
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/v2/health || exit 1" ]
      interval: 60s
      start_period: 30s
    depends_on:
      kuvasz-db:
        condition: service_healthy
volumes:
  kuvasz-db-data:
