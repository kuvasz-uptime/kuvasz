services:
  postgres-16:
    image: postgres:16
    container_name: postgres16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: 'Europe/Vienna'
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  kuvasz:
    image: kuvaszmonitoring/kuvasz:latest
    ports:
      - "8080:8080"
    environment:
      TZ: 'Europe/Vienna'
      DATABASE_HOST: postgres16
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      ENABLE_LOG_EVENT_HANDLER: 'true'
      UPTIME_DATA_RETENTION_DAYS: 365
      LATENCY_DATA_RETENTION_DAYS: 30
    volumes:
      - ./application-dev.yml:/config/kuvasz.yml
    depends_on:
      - postgres-16
  keycloak:
    # A local OIDC provider for exercising Kuvasz's OIDC-based authentication.
    # Admin console: http://localhost:8083 (admin/admin)
    # The "kuvasz" realm (a confidential client + a test user) is imported from ./keycloak on the first startup.
    # To wire it into Kuvasz, enable the OIDC block in application-dev.yml (see the comments there).
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      TZ: 'Europe/Vienna'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Advertise the same URL the browser AND the host-run Kuvasz use, so the issuer stays consistent
      KC_HOSTNAME: http://localhost:8083
      # ...or advertise the compose service name instead, for when the "kuvasz" container (rather than a host-run
      # Kuvasz) talks to Keycloak. The container reaches it at http://keycloak:8083, and to keep the issuer
      # consistent the browser must resolve the same URL, so add "127.0.0.1 keycloak" to your /etc/hosts and
      # switch the OIDC issuer in application-dev.yml to http://keycloak:8083/realms/kuvasz.
      #      KC_HOSTNAME: http://keycloak:8083
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: 8083
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres16:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - "8083:8083"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      - postgres-16
  http-echo:
    image: mendhak/http-https-echo:40
    ports:
      - "8081:8080"
      - "8443:8443"
  # Outbound proxies to check HTTP monitors through. A host-run Kuvasz (./gradlew app:run) reaches them on localhost,
  # and the "proxies" block of application-local.yml registers them. Behind them, the names of the services of this
  # file resolve (e.g. http://http-echo:8080), which a host-run Kuvasz can't reach directly, so a monitor of such a
  # target is only UP through a proxy.
  # The SOCKS5 ports avoid 1080 and 1081, which the test suite's MockServers use.
  squid:
    # Stock config: CONNECT is only allowed to the SSL ports, so a plain HTTP target is refused with a 403
    image: ubuntu/squid:6.6-24.04_edge
    ports:
      - "3128:3128"
  squid-any-port:
    # The same Squid, but configured to tunnel to any port, so plain HTTP targets work through it too
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./squid-any-port.conf:/etc/squid/squid.conf:ro
    ports:
      - "3131:3128"
  proxy-open:
    # HTTP CONNECT on 3128, SOCKS5 on 1080, without authentication
    image: ghcr.io/tarampampam/3proxy:2.3.0
    environment:
      # Its own default resolvers are public ones, which know nothing about the names of the services of this file
      PRIMARY_RESOLVER: 127.0.0.11
    ports:
      - "3129:3128"
      - "11080:1080"
  proxy-auth:
    # The same as proxy-open, but both protocols require a username and a password
    image: ghcr.io/tarampampam/3proxy:2.3.0
    environment:
      PRIMARY_RESOLVER: 127.0.0.11
      PROXY_LOGIN: kuvasz
      PROXY_PASSWORD: kuvasz-proxy-password
    ports:
      - "3130:3128"
      - "11081:1080"
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: 'false'
