latencyHistorySwitchDescription=Jeśli włączone, Kuvasz będzie rejestrować opóźnienia URL i wyświetlać je w panelu. Może to zwiększyć rozmiar danych.
metricsHistorySwitchLabel=Historia metryk
metricsHistorySwitchDescription=Jeśli włączone, Kuvasz będzie rejestrować dane o opóźnieniach i utracie pakietów oraz wyświetlać je na pulpicie. Pamiętaj, że może to znacznie zwiększyć rozmiar przechowywanych danych, szczególnie przy krótkim interwale sprawdzania.
forceNoCacheSwitchLabel=Wyślij nagłówek „no-cache”
forceNoCacheSwitchDescription=Jeśli włączone, Kuvasz dołączy nagłówek „no-cache” — pomocne przy monitorowaniu aktualnych wersji stron.
followRedirectsSwitchLabel=Podążaj za przekierowaniami
