monitorNameReadOnlyTooltip=The name of this monitor cannot be changed, because it''s referenced in the YAML configuration by at least one status page.
monitorUrlLabel=URL
monitorUrlPlaceholder=The URL that will be monitored
sensitiveUrlLabel=Sensitive/secret URL
sensitiveUrlDescription=If this option is selected, the URL of this monitor will be masked in the metrics, logs and integrations (notifications) to avoid leaking sensitive information
sslCheckLabel=SSL certificate check
requestSettingsLabel=Request settings
evaluationSettingsLabel=Evaluation settings
expectedStatusCodesLabel=Expected status codes
expectedStatusCodesDescription=A list of HTTP status codes that are considered as successful responses. If the response code is not in this list, Kuvasz will consider the monitor as down. If you leave this field empty, Kuvasz will consider all 2xx responses as successful.
expectedKeywordLabel=Expected keyword
expectedKeywordDescription=An arbitrary string that is expected to be present (or not, in case the expectation is negated below) in the response body of the monitored URL.
expectedKeywordCaseSensitiveLabel=Case-sensitive keyword match
expectedKeywordCaseSensitiveDescription=If enabled, the keyword match will be case-sensitive.
negateExpectedKeywordLabel=Reverse keyword match
negateExpectedKeywordDescription=If enabled, Kuvasz will consider the monitor as down if the expected keyword is present in the response body.
responseTimeThresholdLabel=Response time threshold (ms)
responseTimeThresholdDescription=If the response time of the monitored URL exceeds this threshold, Kuvasz will consider the monitor as down.
integrationsLabel=Integrations
uptimeCheckIntervalLabel=Uptime check interval (seconds)
latencyHistorySwitchLabel=Latency history
latencyHistorySwitchDescription=If enabled, Kuvasz will record the latency of the given URL and display it in the dashboard. Be aware that this can increase the stored data size significantly, especially if the uptime check interval is low.
metricsHistorySwitchLabel=Metrics history
metricsHistorySwitchDescription=If enabled, Kuvasz will record latency and packet loss data and display it in the dashboard. Be aware that this can increase the stored data size significantly, especially if the uptime check interval is low.
forceNoCacheSwitchLabel=Send no-cache header
forceNoCacheSwitchDescription=If enabled, Kuvasz will send a no-cache header with the request to the given URL, which can help to get the latest version of the page.
followRedirectsSwitchLabel=Follow redirections
followRedirectsSwitchDescription=If enabled, Kuvasz will follow HTTP redirects (3xx responses) when checking the given URL. This is useful if the URL redirects to another URL, and you want to monitor the final destination.
sslCheckSwitchLabel=SSL checks
sslCheckSwitchDescription=Enable SSL checks for this monitor. If enabled, Kuvasz will check the SSL certificate of the given URL and alert you if it is about to expire.
requestMethodLabel=Request HTTP method
sslExpiryThresholdLabel=Certificate expiry threshold (days)
sslExpiryThresholdDescription=The number of days before the SSL certificate expires when you want to be alerted. If the certificate is about to expire within this threshold, Kuvasz will alert you.
failureCountThresholdLabel=Failure count threshold
failureCountThresholdDescription=The number of consecutive failures after which Kuvasz will consider the monitor as down. If you set it to 1, Kuvasz will consider the monitor as down after the first failure, while if you set it to a higher number, it will wait for that many consecutive failures before marking the monitor as down.
httpMethodLabel=HTTP request method
requestHeadersLabel=Request headers
requestHeadersDescription=You can specify custom HTTP headers that will be sent with the request to the monitored URL. If you specify "User-Agent" or "Cache-Control" here, it will override the built-in user agent and the "Send no-cache header" settings respectively.
expectedHeadersLabel=Expected headers
expectedHeadersDescription=You can specify HTTP headers that are expected to be present in the response of the monitored URL. If any of these headers are missing, Kuvasz will consider the monitor as down. The check will be case-insensitive, and the order of the headers does not matter, but the values must match exactly.
headerNameLabel=Header
headerValueLabel=Value
httpMethodDescription=HEAD does NOT contain a response body, so it cannot be used for keyword matching. Only POST, PUT and PATCH could contain a request body, so even if you specify it explicitly, it will be ignored for the other methods.
requestBodyLabel=Request body
requestBodyDescription=You can specify a JSON request body that will be sent with the request to the monitored URL if you choose a method that supports it (POST, PUT or PATCH).
requestBodyPlaceholder=JSON request body
