# The endpoints of the stub target, shared by its plain and its TLS server
# Healthy: fast response with a keyword and a header to match on
location = /ok {
    content_by_lua_block {
        ngx.sleep(math.random(5, 50) / 1000)
        ngx.header["X-Bench"] = "ok"
        ngx.header["Content-Type"] = "text/plain"
        ngx.say("kuvasz-bench-ok")
    }
}

# Slow, but still within every timeout
location = /slow {
    content_by_lua_block {
        ngx.sleep(math.random(300, 2000) / 1000)
        ngx.header["X-Bench"] = "ok"
        ngx.say("kuvasz-bench-ok")
    }
}

# Flapping: UP for {period} seconds, then DOWN for {period} seconds, based on the wall clock
location ~ ^/flap/(\d+)$ {
    content_by_lua_block {
        local period = tonumber(ngx.var[1])
        if math.floor(ngx.time() / period) % 2 == 0 then
            ngx.header["X-Bench"] = "ok"
            ngx.say("kuvasz-bench-ok")
        else
            ngx.exit(503)
        end
    }
}

location = /down {
    return 503;
}

# Never answers within Kuvasz's HTTP check timeout (30s by default)
location = /hang {
    content_by_lua_block {
        ngx.sleep(120)
        ngx.say("too late")
    }
}

# Sink of the webhook integration
location = /hook {
    content_by_lua_block {
        ngx.shared.stats:incr("hooks", 1, 0)
        ngx.exit(204)
    }
}

location = /stats {
    content_by_lua_block {
        ngx.say(ngx.shared.stats:get("hooks") or 0)
    }
}
