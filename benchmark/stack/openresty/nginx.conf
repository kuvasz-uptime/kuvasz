# Stub HTTP(S)/TCP target of the benchmark. Every endpoint models one target behavior of the monitor mixes.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    # Monitored sites are mostly distinct hosts in real life, so a check rarely finds an open connection to reuse.
    # With keep-alive turned off, every check does its own TCP (and TLS) handshake, like it would with real targets.
    keepalive_timeout 0;
    lua_shared_dict stats 1m;

    init_worker_by_lua_block {
        math.randomseed(ngx.time() + ngx.worker.pid())
    }

    server {
        listen 80;
        listen 8081;
        include /usr/local/openresty/nginx/conf/kbench/locations.conf;
    }

    # HTTP/1.1 only, on purpose: every HTTPS monitor of the benchmark points at the same origin, so over HTTP/2 Kuvasz
    # would multiplex the checks of many monitors over a single connection, which doesn't happen with real targets
    # (mostly distinct hosts). This way every check does its own TLS handshake, like it would with real targets.
    server {
        listen 443 ssl;
        ssl_certificate /pki/target.crt;
        ssl_certificate_key /pki/target.key;
        include /usr/local/openresty/nginx/conf/kbench/locations.conf;
    }
}
