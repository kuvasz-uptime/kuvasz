[project]
name = "kbench"
version = "0.1.0"
description = "Capacity benchmark harness for the Kuvasz docker image"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
